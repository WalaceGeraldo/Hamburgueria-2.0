<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pedidos - Burger 2.0</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .orders-container {
            max-width: 800px;
            margin: 120px auto 50px;
            padding: 0 1rem;
            min-height: 60vh;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .order-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .order-id {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
        }

        .order-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .order-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .status-pendente {
            background: rgba(255, 183, 3, 0.2);
            color: #FFB703;
        }

        .status-entregue {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .status-cancelado {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .order-items {
            margin-bottom: 1rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        .order-total {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-print {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-print:hover {
            background: var(--primary);
            color: white;
        }

        /* Print Styles */
        /* Print Styles */
        @media print {
            body {
                background-color: white !important;
                color: black !important;
            }

            /* Hide Everything by default */
            body>* {
                display: none !important;
            }

            /* Show Print Area */
            #print-area {
                display: block !important;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 20px;
                background-color: white !important;
            }

            /* Ensure children of print area are visible if they were hidden by specific rules */
            #print-area * {
                display: block;
                /* resets */
                visibility: visible;
            }

            .order-item-print {
                display: flex !important;
                justify-content: space-between;
            }

            .print-flex {
                display: flex !important;
                justify-content: space-between;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar from Index -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <a href="index.html" style="text-decoration:none;">
                    <h1>Burger<span class="highlight">2.0</span></h1>
                </a>
            </div>
            <button class="menu-toggle" id="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="navbar-content" id="navbar-content">
                <ul class="nav-links">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="menu.html">Cardápio</a></li>
                    <li><a href="about.html">Sobre</a></li>
                    <li><a href="contact.html">Contato</a></li>
                </ul>
                <div class="auth-buttons" style="display: flex; align-items: center; gap: 15px;">
                    <a href="login.html" id="login-btn" class="btn-text" style="text-decoration:none;">Entrar</a>
                    <span id="user-display" class="user-display" style="display: none; color: var(--primary);"></span>
                    <a href="orders.html" id="my-orders-btn" class="btn-text"
                        style="display: none; font-size: 0.9rem; text-decoration: none;"><i
                            class="fa-solid fa-receipt"></i> Meus Pedidos</a>
                    <button id="logout-btn" class="btn-text" style="display: none;"><i
                            class="fa-solid fa-right-from-bracket"></i></button>
                    <!-- Cart Indicator in Header for Desktop -->
                    <div id="header-cart-indicator"
                        style="color: var(--primary); font-weight: bold; margin-left:10px; display:none;">
                        <i class="fa-solid fa-cart-shopping"></i> <span id="header-cart-count">0</span>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="orders-container">
        <h2 style="margin-bottom: 2rem;">Meus Pedidos</h2>
        <div id="orders-list">
            <!-- Orders injected via JS -->
            <p style="text-align: center; color: var(--text-muted);">Carregando pedidos...</p>
        </div>
    </div>

    <!-- Hidden Print Area -->
    <div id="print-area" style="display: none;"></div>

    <script src="assets/js/script.js"></script>
    <script>
        // Inline script for specific page logic
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth(); // Ensure user is logged in
            loadUserOrders();
        });

        function loadUserOrders() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'index.html'; // Redirect if not logged in
                return;
            }

            const allOrders = JSON.parse(localStorage.getItem('orders')) || [];
            // Filter by email
            const myOrders = allOrders.filter(o => o.customer && o.customer.email === user.email);

            // Sort by date (newest first)
            myOrders.sort((a, b) => b.id - a.id);

            const container = document.getElementById('orders-list');

            if (myOrders.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 3rem;"><i class="fa-solid fa-receipt" style="font-size: 3rem; color: var(--text-muted); margin-bottom: 1rem;"></i><p>Você ainda não fez nenhum pedido.</p><a href="menu.html" class="btn-primary" style="margin-top: 1rem; display: inline-block;">Ver Cardápio</a></div>';
                return;
            }

            container.innerHTML = '';
            myOrders.forEach(order => {
                const date = new Date(order.date).toLocaleString();
                const statusClass = order.status === 'Entregue' ? 'status-entregue' :
                    order.status === 'Cancelado' ? 'status-cancelado' : 'status-pendente';
                const statusLabel = order.status || 'Pendente';

                let itemsHtml = '';
                order.items.forEach(item => {
                    itemsHtml += `
                        <div class="order-item">
                            <span>${item.quantity}x ${item.name}</span>
                            <span>R$ ${(item.price * item.quantity).toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">#${order.id.toString().slice(-6)}</div>
                                <div class="order-meta">${date}</div>
                            </div>
                            <span class="order-status ${statusClass}">${statusLabel}</span>
                        </div>
                        <div class="order-items">
                            ${itemsHtml}
                        </div>
                        <div class="order-footer">
                            <div class="order-total">Total: R$ ${order.total.toFixed(2).replace('.', ',')}</div>
                            <button class="btn-print" onclick="printOrder('${order.id}')">
                                <i class="fa-solid fa-print"></i> Imprimir
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function printOrder(orderId) {
            const allOrders = JSON.parse(localStorage.getItem('orders')) || [];
            const order = allOrders.find(o => o.id == orderId); // Loose equality for string/number match

            if (!order) return;

            const printArea = document.getElementById('print-area');

            // Build Receipt HTML
            let itemsHtml = '';
            order.items.forEach(item => {
                itemsHtml += `
                    <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px;">
                        <span>${item.quantity}x ${item.name}</span>
                        <span>R$ ${(item.price * item.quantity).toFixed(2).replace('.', ',')}</span>
                    </div>
                `;
            });

            printArea.innerHTML = `
                <div style="text-align: center; font-family: 'Courier New', monospace; max-width: 300px; margin: 0 auto;">
                    <h2 style="margin: 0; font-size: 18px;">BURGER 2.0</h2>
                    <p style="margin: 0; font-size: 12px; border-bottom: 1px dashed #000; padding-bottom: 10px;">Comprovante de Pedido</p>
                    
                    <div style="margin: 10px 0; text-align: left;">
                        <p style="margin: 2px 0;"><strong>Pedido:</strong> #${order.id.toString().slice(-6)}</p>
                        <p style="margin: 2px 0;"><strong>Data:</strong> ${new Date(order.date).toLocaleString()}</p>
                        <p style="margin: 2px 0;"><strong>Cliente:</strong> ${order.customer.name}</p>
                    </div>

                    <div style="border-bottom: 1px dashed #000; padding-bottom: 10px; margin-bottom: 10px;">
                        ${itemsHtml}
                    </div>

                    <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: bold;">
                        <span>TOTAL</span>
                        <span>R$ ${order.total.toFixed(2).replace('.', ',')}</span>
                    </div>
                    
                    <p style="margin-top: 20px; font-size: 10px;">Obrigado pela preferência!</p>
                </div>
            `;

            window.print();
        }
    </script>

    <!-- Required for Navbar interactions -->
    <!-- Auth Modal (Hidden but required for script.js checks) -->
    <div id="auth-modal" style="display:none;"></div>
    <!-- Cart Modal -->
    <div id="cart-modal" class="auth-overlay">
        <!-- Minimal placeholder so script.js doesn't error out on checkAuth/openCart -->
        <div class="auth-container">
            <div id="close-cart-btn"></div>
            <div id="cart-items"></div>
            <div id="cart-total"></div>
        </div>
    </div>
    <button id="cart-btn" style="display:none;"></button>
</body>

</html>
